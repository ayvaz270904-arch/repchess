# Cloudflare Worker «repchess-api» — API между тренеркой/CRM/ботом и Postgres.
# Отдельный проект, не сайт: выкладывается командой `npx wrangler deploy` из папки api/.
# Секреты задаёт владелец (значения в репозиторий не попадают):
#   npx wrangler secret put DATABASE_URL — строка подключения к базе postgresql://…
#   npx wrangler secret put SERVICE_KEY  — служебный ключ для бота и CRM-прокси
# Адрес и логин базы тоже только в секрете: репозиторий публичный.
name = "repchess-api"
main = "src/worker.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Рабочая схема (переключение 10.11.2026). staging — тестовая копия на 09.11, не трогать в работе.
PGSCHEMA = "prod"
FIREBASE_PROJECT_ID = "repchess-trainer"
ALLOWED_ORIGINS = "https://repchess.ayvaz-270904.workers.dev,https://ayvaz270904-arch.github.io"
AUTH_PROVIDERS = "firebase,service"
# CRM-прокси (Apps Script): раз в минуту расписание ниже просит его сверить лист оплат Table 2
# с копией в базе (src/payments.js). Тот же адрес, что _CSV в trainer.html.
PAYMENTS_PROXY_URL = "https://script.google.com/macros/s/AKfycbx7_UDm2N5BXftfgZbHa66gAs_ZnbT7ed-N9BuuGJowd3qcVztlrncg_bI_Hzsm_7_cAA/exec"

# Расписание: копия оплат (с 11.11.2026). Минутный триггер в Apps Script съедал бы ~треть
# суточной квоты триггеров аккаунта (90 мин), поэтому минуту отсчитывает Cloudflare.
[triggers]
crons = ["* * * * *"]

# Подключение к базе через Hyperdrive (см. src/worker.js). Конфигурация repchess-db создана
# 10.11.2026: кэш запросов выключен, sslmode verify-ca, сертификат центра repchess-db-ca
# (центр сервера базы, загружен `wrangler cert upload certificate-authority`).
# Пароль базы хранится в самой конфигурации; при его смене:
#   npx wrangler hyperdrive update <id> --origin-password "…"
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "fbb2b8ab3dda4dfd846f2fd4f66bbfde"
